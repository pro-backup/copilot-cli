VPC:
  Metadata:
    'aws:copilot:description': 'A Virtual Private Cloud to control networking of your AWS resources'
  Type: AWS::EC2::VPC
  Properties:
    CidrBlock: {{.VPCConfig.Managed.CIDR}}
    EnableDnsHostnames: true
    EnableDnsSupport: true
    InstanceTenancy: default
    Tags:
      - Key: Name
        Value: !Sub 'copilot-${AppName}-${EnvironmentName}'

PublicRouteTable:
  Metadata:
    'aws:copilot:description': "A custom route table that directs network traffic for the public subnets"
  Type: AWS::EC2::RouteTable
  Properties:
    VpcId: !Ref VPC
    Tags:
      - Key: Name
        Value: !Sub 'copilot-${AppName}-${EnvironmentName}'

DefaultPublicRoute:
  Type: AWS::EC2::Route
  DependsOn: InternetGatewayAttachment
  Properties:
    RouteTableId: !Ref PublicRouteTable
    DestinationCidrBlock: 0.0.0.0/0
    GatewayId: !Ref InternetGateway

InternetGateway:
  Metadata:
    'aws:copilot:description': 'An Internet Gateway to connect to the public internet'
  Type: AWS::EC2::InternetGateway
  Properties:
    Tags:
      - Key: Name
        Value: !Sub 'copilot-${AppName}-${EnvironmentName}'

InternetGatewayAttachment:
  Type: AWS::EC2::VPCGatewayAttachment
  Properties:
    InternetGatewayId: !Ref InternetGateway
    VpcId: !Ref VPC

{{- if .VPCConfig.IPv6Enabled }}
VPCCidrBlockIPv6:
  Metadata:
    'aws:copilot:description': 'An Amazon-provided IPv6 /56 CIDR block associated with the VPC'
  Type: AWS::EC2::VPCCidrBlock
  Properties:
    VpcId: !Ref VPC
    AmazonProvidedIpv6CidrBlock: true

EgressOnlyInternetGateway:
  Metadata:
    'aws:copilot:description': 'An egress-only internet gateway for private subnets to reach the IPv6 internet'
  Type: AWS::EC2::EgressOnlyInternetGateway
  Properties:
    VpcId: !Ref VPC
{{- end }}

{{- $azs := .VPCConfig.Managed.AZs }}
{{- range $ind, $cidr := .VPCConfig.Managed.PublicSubnetCIDRs}}
PublicSubnet{{inc $ind}}:
  Metadata:
    'aws:copilot:description': 'Public subnet {{inc $ind}} for resources that can access the internet'
  Type: AWS::EC2::Subnet
  Properties:
    CidrBlock: {{$cidr}}
    VpcId: !Ref VPC
    {{- if $azs }}
    AvailabilityZone: {{index $azs $ind}}
    {{- else }}
    AvailabilityZone: !Select [ {{$ind}}, !GetAZs '' ]
    {{- end }}
    MapPublicIpOnLaunch: true
    Tags:
      - Key: Name
        Value: !Sub 'copilot-${AppName}-${EnvironmentName}-pub{{$ind}}'
{{- end }}
{{- range $ind, $cidr := .VPCConfig.Managed.PrivateSubnetCIDRs }}
PrivateSubnet{{inc $ind}}:
  Metadata:
    'aws:copilot:description': 'Private subnet {{inc $ind}} for resources with no internet access'
  Type: AWS::EC2::Subnet
  Properties:
    CidrBlock: {{$cidr}}
    VpcId: !Ref VPC
    {{- if $azs }}
    AvailabilityZone: {{index $azs $ind}}
    {{- else }}
    AvailabilityZone: !Select [ {{$ind}}, !GetAZs '' ]
    {{- end }}
    MapPublicIpOnLaunch: false
    Tags:
      - Key: Name
        Value: !Sub 'copilot-${AppName}-${EnvironmentName}-priv{{$ind}}'
{{- end }}
{{- range $ind, $cidr := .VPCConfig.Managed.PublicSubnetCIDRs}}
PublicSubnet{{inc $ind}}RouteTableAssociation:
  Type: AWS::EC2::SubnetRouteTableAssociation
  Properties:
    RouteTableId: !Ref PublicRouteTable
    SubnetId: !Ref PublicSubnet{{inc $ind}}
{{- end}}