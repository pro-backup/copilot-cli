            aws:copilot:description: A security group for your load balancer allowing HTTP traffic
        Properties:
            GroupDescription: HTTP access to the public facing load balancer
            SecurityGroupIngress:
                - CidrIp: 0.0.0.0/0
                  Description: Allow from anyone on port 80
                  FromPort: 80
                  IpProtocol: tcp
                  ToPort: 80
            Tags:
                - Key: Name
                  Value: copilot-${AppName}-${EnvironmentName}-lb-http
            VpcId: vpc-12345
        Type: AWS::EC2::SecurityGroup
    PublicHTTPLoadBalancerSecurityGroupIngressIPv6:
        Condition: CreateALB
        Metadata:
            aws:copilot:description: An IPv6 inbound rule to the public HTTP load balancer security group for port 80
        Properties:
            CidrIpv6: ::/0
            Description: Allow from anyone over IPv6 on port 80
            FromPort: 80
            GroupId: PublicHTTPLoadBalancerSecurityGroup
            IpProtocol: tcp
            ToPort: 80
        Type: AWS::EC2::SecurityGroupIngress
    PublicHTTPSLoadBalancerSecurityGroup:
        Condition: ExportHTTPSListener
        Metadata:
            aws:copilot:description: A security group for your load balancer allowing HTTPS traffic
        Properties:
            GroupDescription: HTTPS access to the public facing load balancer
            SecurityGroupIngress:
                - CidrIp: 0.0.0.0/0
                  Description: Allow from anyone on port 443
                  FromPort: 443
                  IpProtocol: tcp
                  ToPort: 443
            Tags:
                - Key: Name
                  Value: copilot-${AppName}-${EnvironmentName}-lb-https
            VpcId: vpc-12345
        Type: AWS::EC2::SecurityGroup
    PublicHTTPSLoadBalancerSecurityGroupIngressIPv6:
        Condition: ExportHTTPSListener
        Metadata:
            aws:copilot:description: An IPv6 inbound rule to the public HTTPS load balancer security group for port 443
        Properties:
            CidrIpv6: ::/0
            Description: Allow from anyone over IPv6 on port 443
            FromPort: 443
            GroupId: PublicHTTPSLoadBalancerSecurityGroup
            IpProtocol: tcp
            ToPort: 443
        Type: AWS::EC2::SecurityGroupIngress
    PublicLoadBalancer:
        Condition: CreateALB
        Metadata:
            aws:copilot:description: An Application Load Balancer to distribute public traffic to your services
        Properties:
            IpAddressType: dualstack
            LoadBalancerAttributes:
                - Key: access_logs.s3.enabled
                  Value: false
            Scheme: internet-facing
            SecurityGroups:
                - PublicHTTPLoadBalancerSecurityGroup.GroupId
                - - ExportHTTPSListener
                  - PublicHTTPSLoadBalancerSecurityGroup.GroupId
                  - AWS::NoValue
            Subnets:
                - subnet-pub-1
                - subnet-pub-2
            Type: application
        Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    ServiceDiscoveryNamespace:
        Metadata:
            aws:copilot:description: A private DNS namespace for discovering services within the environment
        Properties:
            Name: ServiceDiscoveryEndpoint
            Vpc: vpc-12345
        Type: AWS::ServiceDiscovery::PrivateDnsNamespace
